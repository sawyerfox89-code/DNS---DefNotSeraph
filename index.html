<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seraph</title>
    <link rel="icon" href="/images/ico.ico" type="image/x-icon" />
    <style>
      :root {
        --bg: #050505;
        --bg-2: #111111;
        --panel: rgba(255, 255, 255, 0.02);
        --line: rgba(255, 255, 255, 0.4);
        --text: #f3f3f3;
        --muted: rgba(255,255,255,0.72);
        --soft: rgba(255,255,255,0.55);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% 20%, rgba(255,255,255,0.18), transparent 28%),
          radial-gradient(circle at 55% 50%, rgba(255,255,255,0.08), transparent 42%),
          linear-gradient(90deg, #000 0%, #0d0d0d 10%, #090909 20%, #000 50%, #0a0a0a 80%, #000 100%);
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(rgba(255,255,255,0.72) 0.6px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.52) 0.5px, transparent 1px);
        background-size: 7px 7px;
        background-position: center;
        opacity: 0.22;
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .browser-shell {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        height: 42px;
        background: rgba(235, 225, 215, 0.95);
        border-bottom: 1px solid rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        padding: 0 14px;
        gap: 10px;
        color: #111;
      }

      .nav-icons {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        margin-right: 4px;
        color: #1a1a1a;
      }

      .nav-icons .arrow {
        opacity: 0.9;
      }

      .urlbar {
        flex: 1;
        height: 28px;
        border-radius: 999px;
        background: rgba(255,255,255,0.18);
        border: 1px solid rgba(0,0,0,0.08);
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 14px;
        color: #1f1f1f;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .urlbar .lock {
        font-size: 13px;
        margin-right: 8px;
        opacity: 0.7;
      }

      .content {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .panel {
        width: min(100%, 1000px);
        min-height: 620px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .hero {
        text-align: center;
        transform: translateY(-12px);
      }

      .brand {
        margin: 0;
        font-size: clamp(76px, 12vw, 220px);
        line-height: 0.9;
        letter-spacing: -0.06em;
        font-weight: 800;
        color: rgba(255,255,255,0.96);
        text-shadow: 0 0 12px rgba(255,255,255,0.2), 0 0 26px rgba(255,255,255,0.15);
      }

      .version {
        margin-top: 18px;
        font-size: clamp(18px, 2vw, 32px);
        font-weight: 500;
        color: rgba(255,255,255,0.92);
        letter-spacing: -0.03em;
      }

      .version b {
        font-weight: 700;
      }

      .menu {
        margin-top: 28px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
      }

      .option {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: min(75vw, 260px);
        min-height: 52px;
        padding: 10px 18px;
        border: 2px solid rgba(255,255,255,0.72);
        background: rgba(255,255,255,0.02);
        color: white;
        text-decoration: none;
        font-size: clamp(19px, 2vw, 30px);
        text-transform: lowercase;
        font-weight: 600;
        letter-spacing: -0.04em;
        transition: 0.15s ease;
      }

      .option:hover {
        background: rgba(255,255,255,0.04);
        transform: translateY(-1px);
      }

      .meta-links {
        margin-top: 26px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 16px;
        font-size: clamp(15px, 1.4vw, 20px);
        color: rgba(255,255,255,0.9);
        font-weight: 600;
      }

      .meta-links a {
        color: rgba(255,255,255,0.9);
        text-decoration: none;
      }

      .meta-links a:hover {
        text-decoration: underline;
      }

      .byline {
        margin-top: 18px;
        color: rgba(255,255,255,0.8);
        font-size: 14px;
        letter-spacing: 0.02em;
      }

      .byline a {
        color: rgba(255,255,255,0.9);
        text-decoration: none;
      }

      .byline a:hover { text-decoration: underline; }

      .cookie {
        position: absolute;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.8);
        font-size: 14px;
        text-align: center;
        letter-spacing: 0.01em;
      }

      .cookie a {
        color: rgba(255,255,255,0.9);
      }

      @media (max-width: 640px) {
        .topbar { padding: 0 10px; }
        .urlbar { font-size: 12px; }
        .option { width: min(70vw, 220px); }
      }
    </style>
  </head>
  <body>
    <div class="browser-shell">
      <div class="topbar">
        <div class="nav-icons" aria-hidden="true">
          <span class="arrow">←</span>
          <span class="arrow">→</span>
          <span class="arrow">↻</span>
        </div>
        <div class="urlbar"><span class="lock">🔒</span> joemama980.github.io</div>
      </div>

      <div class="content">
        <div class="panel">
          <div class="hero">
            <h1 class="brand">seraph</h1>
            <div class="version"><b>version 7.1</b> (release build)</div>

            <div class="menu">
              <a class="option" href="/games/index.html">games</a>
              <a class="option" href="/apps/index.html">apps</a>
              <a class="option" href="/settings.html">settings</a>
            </div>

            <div class="meta-links">
              <a href="/seraphim/index.html">mobile</a>
              <span>•</span>
              <a href="/host.html">host</a>
              <span>•</span>
              <a href="/games/index.html">open blank</a>
            </div>

            <div class="meta-links" style="margin-top: 10px;">
              <a href="https://discord.gg/ZyZDmx3zuQ" target="_blank" rel="noreferrer">discord</a>
              <span>•</span>
              <a href="/updatelog.html">update log</a>
              <span>•</span>
              <a href="https://github.com/a456pur/seraph" target="_blank" rel="noreferrer">source code</a>
            </div>

            <div class="byline">
              <a href="https://github.com/a456pur" target="_blank" rel="noreferrer">website created &amp; developed by @a456pur</a>
            </div>
          </div>
        </div>
      </div>

      <div class="cookie">
        <span>we use cookies on this website. <a href="/settings.html">learn more</a></span>
      </div>
    </div>
  </body>
</html>
